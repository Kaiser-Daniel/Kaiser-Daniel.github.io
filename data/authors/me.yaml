bio: |
  Daniel P. O. Kaiser is a physician-scientist (Privatdozent, PD Dr. med. habil.)
  at the Institute for Diagnostic and Interventional Neuroradiology,
  University Hospital Carl Gustav Carus Dresden (TU Dresden). His research
  focuses on acute ischemic stroke — endovascular thrombectomy, advanced
  neuroimaging for treatment selection, tissue-outcome prediction, and the
  use of machine learning in neuroradiology. He collaborates in large
  international, multicenter stroke studies and has authored more than 90
  peer-reviewed publications (Web of Science h-index 22).

